name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PySide6-Essentials:发布身份/恢复配置测试 import miremote.gui 需要
      # (2026-09-23 首跑实证:缺它三个测试 ModuleNotFoundError)。
      - name: 安装测试依赖
        run: pip install pytest PySide6-Essentials
      - name: 纯逻辑单测
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: 手势/迁移/对冲冒烟
        run: python tests/smoke_gestures.py
      - name: 编译全包
        run: python -m compileall -q miremote
